[project]
name = "surface-impact"
version = "0.1.0"
description = "Volatility Surface Skew & State-Dependent Price Impact: SPXW option skew and ES order-flow responses"
authors = [{ name = "Chantry Fultz" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "databento>=0.50",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "cvxpy>=1.5",
    "statsmodels>=0.14",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "exchange-calendars>=4.5",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.33"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
vsimpact = "surface_impact.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surface_impact"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
